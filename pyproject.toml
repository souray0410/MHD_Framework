[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhd-framework"
version = "4"
description = "Explicit multi-hypergraph computation for PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Haoding Souray Meng"}]
dependencies = ["torch>=2.8", "numpy", "tqdm"]

[project.optional-dependencies]
dev = ["pytest>=8", "build"]
models = ["torchvision==0.23.0", "timm==0.9.2"]

[project.urls]
Repository = "https://github.com/souray0410/MHD_Framework"
Issues = "https://github.com/souray0410/MHD_Framework/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mhd_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra -p no:cacheprovider"
