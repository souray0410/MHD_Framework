[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhd-framework"
version = "5.0.0"
description = "Explicit hypergraph computation and named graph adapters for PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Haoding Souray Meng"}]
dependencies = ["torch>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "build"]
models = ["torchvision==0.23.0"]

[project.urls]
Repository = "https://github.com/souray0410/MHD_Framework"
Issues = "https://github.com/souray0410/MHD_Framework/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mhd_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra -p no:cacheprovider"
