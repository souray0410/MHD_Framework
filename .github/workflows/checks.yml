name: Toolbox checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref to validate
        required: true
        default: main
        type: choice
        options: [main, V4, V5]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/manage.py test
      - run: python -m build
      - name: Wheel import outside checkout
        run: |
          python -m pip uninstall -y mhd-framework
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python -c "import mhd_framework, mhd_framework.utils; print(mhd_framework.__version__, mhd_framework.__file__)"
